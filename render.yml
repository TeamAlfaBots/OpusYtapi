services:
  - type: web
    name: opus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /ping
    # Sirf secrets yaha hain. Baaki sab defaults OpusApi/config.py me hain.
    envVars:
      - key: BASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: KEY_ENC_SECRET
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_CACHE_CHANNEL
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: FORCE_CHANNELS
        sync: false
      - key: PROXIES
        sync: false
      - key: COOKIES_B64
        sync: false
        
